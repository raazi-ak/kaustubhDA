services:
  - type: web
    name: realestate-portal
    env: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: PORT
        value: 8080
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_URL
        sync: false

databases:
  - name: realestate-db
    databaseName: realestate_db
    user: realestate_user
    plan: free

